# A block scalar whose header sits on its own line, which yaml.v3's encoder
# would move onto the key line, dropping a leading blank line or adding a
# trailing one under keep chomping (#274).
nop: ok
banner:
  |

  leading blank
config:
  # keep chomping, followed by another key
  script:
    |+
    run

  timeout: 5
---
nop: ok
greeting:
  >
  hello
  world
