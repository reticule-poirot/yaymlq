version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    forbidigo:
      forbid:
        - pattern: ^yaml\.NewDecoder$
          msg: a stream reaches the parser only through newDecoder (yamldirective.go)
        - pattern: ^yaml\.(NewEncoder|NewDumper)$
          msg: encode only through encodeYAML (encode.go)
  exclusions:
    rules:
      # Test helpers may ignore errors and use weak randomness.
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo
          - gosec
      # The two files that own the parser and encoder entry points.
      - path: cmd/(yamldirective|encode)\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 3m
